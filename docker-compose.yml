services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: associacao
      POSTGRES_USER: associacao
      POSTGRES_PASSWORD: associacao
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U associacao"]
      interval: 3s
      retries: 20

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: associacao
      POSTGRES_USER: associacao
      POSTGRES_PASSWORD: associacao
      POSTGRES_HOST: db
      DJANGO_ALLOWED_HOSTS: "*"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dados:
